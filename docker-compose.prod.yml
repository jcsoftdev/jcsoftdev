---
# jcsoftdev — production compose for Dokploy
# Import as Dokploy "Compose" service. NOT for local dev.
# Apps (api/web/admin) deploy as separate Dokploy "Application" services
# and reach these via service DNS on the shared dokploy-network.

name: jcsoftdev-infra

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Postgres is the single point of truth for both apps — give it the
    # largest guaranteed share of the VPS budget so noisy neighbors
    # (ClickHouse in particular) can't starve it under memory pressure.
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "1.5"
        reservations:
          memory: 512M
          cpus: "0.5"
    networks:
      - dokploy-network

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # pgbouncer listens on 5432 inside its own container (LISTEN_PORT not
      # overridden here) and speaks the Postgres wire protocol, so pg_isready
      # (bundled in the edoburu image) works directly against it.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$DB_USER -d $$DB_NAME"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # Lightweight but on the critical path for every API query — small
    # limit is enough, and it must never be starved out.
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    networks:
      - dokploy-network

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --save 60 1 --appendonly yes
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - dokploy-network

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    # No Traefik labels here on purpose (C3 fix): the MinIO console (:9001)
    # is only auth'd by the static root password and must NOT be reachable
    # from the public internet. The S3 API (:9000) stays internal-only too —
    # apps reach it via service DNS (`minio:9000`) on dokploy-network.
    #
    # Console access: SSH-tunnel to the VPS instead of exposing it publicly:
    #   ssh -L 9001:localhost:9001 <user>@<VPS_IP>
    #   open http://localhost:9001
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - dokploy-network

  plausible-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLAUSIBLE_DB_NAME}
      POSTGRES_USER: ${PLAUSIBLE_DB_USER}
      POSTGRES_PASSWORD: ${PLAUSIBLE_DB_PASSWORD}
    volumes:
      - plausible-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - dokploy-network

  plausible-events-db:
    image: clickhouse/clickhouse-server:25.8.31.9
    restart: unless-stopped
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    volumes:
      - plausible-events-data:/var/lib/clickhouse
      - ./infra/clickhouse/override.xml:/etc/clickhouse-server/users.d/override.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # ClickHouse is historically the most likely service to OOM-kill its
    # neighbors on a small VPS — capped tighter than Postgres on purpose.
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    networks:
      - dokploy-network

  # ── One-shot migrator + seeder ───────────────────────────────────────────────
  # Run manually after first deploy or whenever migrations change:
  #   docker compose -f docker-compose.prod.yml --profile migrate run --rm migrator
  # Connects directly to postgres:5432 (NOT pgbouncer) — drizzle requires session
  # mode for DDL. Exits 0 on success.
  migrator:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      DATABASE_DIRECT_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - dokploy-network

  # ── One-shot seed sync ───────────────────────────────────────────────────────
  # Run when the seed CONTENT changed — a CV rewrite, a renamed project, a role
  # whose dates moved:
  #   docker compose -f docker-compose.prod.yml --profile sync run --rm syncer
  #
  # The `migrator` above runs the plain `seed`, which uses ON CONFLICT DO NOTHING
  # (ADR-17) so admin edits survive a deploy. That is the right default, and it is
  # also why it can never push a changed data.ts to an already-seeded database.
  #
  # `sync` is the deliberate opposite: data.ts wins over whatever is in the row,
  # and slugs listed in SUPERSEDED_PROJECT_SLUGS are deleted. It stays behind its
  # own profile precisely so a routine deploy cannot silently overwrite an edit
  # someone made in the admin UI.
  #
  # --confirm is passed because invoking this profile IS the confirmation; the
  # guard exists to stop an accidental run, not a typed-out one.
  syncer:
    profiles: ["sync"]
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    command:
      ["sh", "-c", "node_modules/.bin/tsx src/seeds/sync.ts --confirm"]
    environment:
      NODE_ENV: production
      DATABASE_DIRECT_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      # Flushes public:portfolio:v1 so the API serves the new data immediately
      # instead of waiting out the cache TTL.
      VALKEY_URL: "redis://valkey:6379"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - dokploy-network

  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    restart: unless-stopped
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    environment:
      BASE_URL: "https://analytics.${DOMAIN}"
      SECRET_KEY_BASE: ${PLAUSIBLE_SECRET_KEY_BASE}
      DATABASE_URL: "postgres://${PLAUSIBLE_DB_USER}:${PLAUSIBLE_DB_PASSWORD}@plausible-db:5432/${PLAUSIBLE_DB_NAME}"
      CLICKHOUSE_DATABASE_URL: "http://default:${CLICKHOUSE_PASSWORD}@plausible-events-db:8123/plausible_events_db"
      DISABLE_REGISTRATION: "true"
    depends_on:
      plausible-db:
        condition: service_healthy
      plausible-events-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plausible.rule=Host(`analytics.${DOMAIN}`)"
      - "traefik.http.routers.plausible.entrypoints=websecure"
      - "traefik.http.routers.plausible.tls.certresolver=letsencrypt"
      - "traefik.http.services.plausible.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - dokploy-network

volumes:
  postgres-data:
  valkey-data:
  minio-data:
  plausible-db-data:
  plausible-events-data:

networks:
  dokploy-network:
    external: true
