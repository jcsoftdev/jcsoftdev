name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Main CI pipeline ─────────────────────────────────────────────────────────
  ci:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest

    services:
      # Postgres 17 for integration tests and migration validation
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jcsoftdev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Valkey 8 for session + MDX cache integration tests
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # ── Database ─────────────────────────────────────────────────────────────
      # Tests use pgBouncer-style URL via the workflow Postgres service directly.
      # Migrations always use DATABASE_DIRECT_URL (no connection pooler in CI).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jcsoftdev_test
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/jcsoftdev_test

      # ── Valkey ───────────────────────────────────────────────────────────────
      VALKEY_URL: redis://localhost:6379

      # ── API env (required by env.ts validation on import) ────────────────────
      NODE_ENV: test
      PORT: "3000"
      CORS_ORIGINS: "http://localhost:3000"
      BETTER_AUTH_SECRET: "ci-secret-at-least-32-chars-long-pad"
      BETTER_AUTH_URL: "http://localhost:3000"
      RESEND_API_KEY: "re_ci_placeholder"
      RESEND_FROM_EMAIL: "ci@example.com"
      MINIO_ENDPOINT: "http://localhost:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_PUBLIC_URL: "http://localhost:9000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # jdx/mise-action reads .mise.toml and installs all pinned tools:
      # Node 24, Bun 1.4, pnpm 10
      - name: Install toolchain via mise
        uses: jdx/mise-action@v2

      # Cache pnpm store — keyed on lockfile for deterministic hits
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      # Cache Turborepo artifacts — restore across commits for unchanged tasks
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: |
            turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Drizzle dedup gate ────────────────────────────────────────────────────
      # Fail CI if more than 1 unique version of drizzle-orm is resolved.
      # Multiple versions indicate a broken override or a new dep pulling in a
      # different major — this would cause runtime type incompatibilities.
      - name: Drizzle-orm dedup gate
        run: |
          COUNT=$(pnpm why drizzle-orm --recursive 2>/dev/null | grep -c "^drizzle-orm@" || echo "0")
          if [ "$COUNT" -gt "1" ]; then
            echo "ERROR: $COUNT versions of drizzle-orm resolved in workspace."
            echo "Run: pnpm why drizzle-orm --recursive"
            echo "Fix: ensure pnpm.overrides.drizzle-orm pins a single version."
            exit 1
          fi
          echo "drizzle-orm dedup gate passed (versions: $COUNT or pinned singleton)"

      - name: Biome check
        run: pnpm exec biome check

      - name: Typecheck (tsc)
        run: pnpm turbo typecheck

      # ── Migration gate ────────────────────────────────────────────────────────
      # Run migrations against the CI Postgres service before tests.
      # This confirms migrations apply cleanly and seeds are idempotent.
      # Uses DATABASE_DIRECT_URL (not pgBouncer) per design §3.
      - name: Run database migrations
        run: pnpm --filter @jcsoftdev/db db:migrate

      - name: Seed database
        run: pnpm --filter @jcsoftdev/db seed

      - name: Test
        run: pnpm turbo test

      # ── Integration tests (Testcontainers) ───────────────────────────────────
      # Runs the @jcsoftdev/db Testcontainers integration suite as a separate step.
      # Testcontainers spins its own ephemeral Postgres — independent of the
      # service container above. GitHub-hosted runners have Docker available,
      # so this is BLOCKING (H10 fix): a failure here fails the `ci` job.
      - name: Integration tests (Testcontainers)
        run: pnpm --filter @jcsoftdev/db test:integration

  # ── Fast typecheck via TypeScript-Go (tsgo) — preview, non-blocking ──────────
  # tsgo is Microsoft's experimental Rust/Go port of TypeScript (~10x faster).
  # It runs as a separate parallel job. continue-on-error: true means tsgo
  # failures are informational only — they CANNOT block merge.
  # Remove continue-on-error once tsgo reaches stable GA.
  typecheck-fast:
    name: Typecheck (tsgo — preview)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain via mise
        uses: jdx/mise-action@v2

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Install @typescript/native-preview (tsgo binary)
      # The binary name may be `tsgo` or `typescript-native` depending on release.
      # Pinning with `npx -y` ensures we always get the latest preview build.
      - name: Install tsgo
        run: pnpm add -Dw @typescript/native-preview

      # Run tsgo in build-mode across the monorepo.
      # -b (--build) respects tsconfig project references (turbo references in
      # root tsconfig.json). --noEmit prevents output, type-check only.
      # This step is informational — failures are expected during preview.
      - name: Run tsgo typecheck
        run: pnpm exec tsgo -b --noEmit || true

  # ── E2E Playwright — non-blocking, runs on every PR ──────────────────────────
  # Playwright runs the full happy-path flow: login → write → publish → read.
  # This job is INFORMATIONAL only (continue-on-error: true) — it does NOT
  # block merge. Failures here require a separate investigation cycle.
  # H10 fix: runs on every push/PR now (not gated behind main or an [e2e]
  # label) so failures are visible pre-merge instead of discovered after.
  #
  # The job requires all services (Postgres, Valkey, MinIO) to be running.
  # In CI, MinIO is started via docker run inline. In local dev, use pnpm dev.
  e2e:
    name: E2E (Playwright — non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jcsoftdev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jcsoftdev_test
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/jcsoftdev_test
      VALKEY_URL: redis://localhost:6379
      NODE_ENV: development
      PORT: "3000"
      CORS_ORIGINS: "http://localhost:5173"
      BETTER_AUTH_SECRET: "e2e-secret-at-least-32-chars-long-pad"
      BETTER_AUTH_URL: "http://localhost:3000"
      RESEND_API_KEY: "re_e2e_placeholder"
      RESEND_FROM_EMAIL: "e2e@example.com"
      MINIO_ENDPOINT: "http://localhost:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_PUBLIC_URL: "http://localhost:9000"
      # Admin SPA URL for Playwright
      ADMIN_URL: "http://localhost:5173"
      # Web public URL for Playwright
      WEB_URL: "http://localhost:4321"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain via mise
        uses: jdx/mise-action@v2

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Start MinIO service (not available as a GitHub Actions service container)
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio server /data --console-address ":9001"
          # Wait for MinIO to be ready
          until curl -sf http://localhost:9000/minio/health/live; do sleep 2; done

      - name: Bootstrap MinIO bucket
        run: bash infra/minio/bootstrap.sh

      - name: Run database migrations
        run: pnpm --filter @jcsoftdev/db db:migrate

      - name: Seed database
        run: pnpm --filter @jcsoftdev/db seed

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm exec playwright test

  # ── Contact reachability ────────────────────────────────────────────────────
  # The site advertised hello@jcsoftdev.com across five surfaces while the
  # domain had no MX records, so every message bounced and nothing reported it.
  # This job is not wired into `deploy`: a DNS hiccup should turn the run red,
  # not hold production hostage.
  contact:
    name: Contact address is reachable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain via mise
        uses: jdx/mise-action@v2

      # No dependencies — the script is plain node with node:dns.
      - name: Check MX for the advertised address
        run: node apps/web/scripts/check-contact-email.mjs

  # ── Deploy — blocking, main only ────────────────────────────────────────────
  # CI owns deployment. Dokploy's own `autoDeploy` must be OFF for these apps,
  # otherwise both fire and race.
  #
  # Why this job exists: Dokploy deployed straight off the push webhook, which
  # meant two things. Red commits reached production, because nothing waited for
  # this workflow. And a push arriving while that app was already building was
  # dropped — silently, with no deployment record and no error anywhere. That is
  # how 90e966a stayed off jcsoftdev.com while `api` deployed it fine.
  #
  # So this job does not just trigger: it waits for the deployment to reach a
  # terminal state and fails if it never appears. A dropped deploy is now a red
  # check instead of nothing at all.
  deploy:
    name: Deploy (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Dokploy runs a single global deployment queue, so triggering three apps at
    # once just makes two of them sit in `waiting` while we poll. One at a time
    # keeps each job's wait honest about what it is waiting for.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        app:
          # These ids are not credentials — they are inert without DOKPLOY_URL
          # and DOKPLOY_API_KEY, both of which are secrets.
          - name: web
            id: PzVqOVZzPFdYPrjDBRvOF
          - name: api
            id: SIq1GvJ-ZcQ8Os0Hc-aAC
          - name: admin
            id: A3s93PkJuctUXtCpxBlkf

    # Never let two runs deploy at once; queue instead of cancelling, so an
    # older commit's deploy finishes rather than leaving prod half-updated.
    concurrency:
      group: deploy-${{ matrix.app.name }}
      cancel-in-progress: false

    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      APP_ID: ${{ matrix.app.id }}
      APP_NAME: ${{ matrix.app.name }}
      TIMEOUT_SECONDS: "900"

    steps:
      - name: Verify secrets are configured
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::error::DOKPLOY_URL and DOKPLOY_API_KEY must be set as repository secrets."
            exit 1
          fi

      - name: Trigger deployment
        id: trigger
        run: |
          set -euo pipefail
          # Recorded before the request so the poll below can tell our
          # deployment apart from one that was already in flight.
          echo "started_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"

          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"applicationId\":\"$APP_ID\"}" \
            -o /dev/null
          echo "Triggered $APP_NAME for ${GITHUB_SHA}"

      - name: Wait for the deployment to finish
        run: |
          set -uo pipefail
          started_at="${{ steps.trigger.outputs.started_at }}"
          deadline=$(( started_at + TIMEOUT_SECONDS ))

          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            sleep 15

            body=$(curl -fsS \
              "$DOKPLOY_URL/api/deployment.all?applicationId=$APP_ID" \
              -H "x-api-key: $DOKPLOY_API_KEY") || continue

            # Dokploy returns the array directly; some proxies wrap it in
            # { data: [...] }. Accept either rather than depending on which.
            latest=$(jq -c 'if type == "array" then .[0] else .data[0] end' <<<"$body") || continue
            [ "$latest" = "null" ] && continue

            created=$(jq -r '.createdAt' <<<"$latest")
            created_epoch=$(date -u -d "$created" +%s 2>/dev/null || echo 0)

            # Ignore whatever was already there when we triggered.
            [ "$created_epoch" -lt "$started_at" ] && continue

            status=$(jq -r '.status' <<<"$latest")
            built=$(jq -r '.description' <<<"$latest")

            case "$status" in
              done)
                echo "$APP_NAME deployed — $built"
                # main may have advanced between the push and the build, which
                # is fine: newer is still correct. Worth saying out loud though.
                if [[ "$built" != *"$GITHUB_SHA"* ]]; then
                  echo "::warning::Built $built, not ${GITHUB_SHA}. main moved ahead during the build."
                fi
                exit 0
                ;;
              error)
                echo "::error::$APP_NAME deployment failed — $built"
                jq -r '.errorMessage // "no error message recorded"' <<<"$latest"
                exit 1
                ;;
              *)
                echo "waiting… status=$status"
                ;;
            esac
          done

          echo "::error::No deployment for $APP_NAME reached a terminal state within ${TIMEOUT_SECONDS}s."
          echo "This is the failure mode that used to be silent — check the Dokploy queue."
          exit 1
