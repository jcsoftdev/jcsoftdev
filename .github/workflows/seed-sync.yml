name: Seed sync

# Pushes packages/db/src/seeds/data.ts into the production database.
#
# ── Who owns projects and experiences ───────────────────────────────────────
# Two writers reach the same rows: this repository's data.ts, and the admin UI,
# which has full CRUD for both tables. They cannot both be the owner, and the
# answer decides whether this workflow runs on every deploy or only on demand.
#
# For now, data.ts owns them, so it runs on every deploy to main. That is a
# deliberate, temporary answer: today nothing in the admin is worth preserving,
# so replacing everything costs nothing and keeps production honest to the repo.
#
# It is NOT the long-term answer. ADR-17 has the api's Pre Deploy Command run
# the plain `seed` (ON CONFLICT DO NOTHING) precisely so an edit made in the
# admin survives a deploy. The moment the admin becomes the real editing surface
# for projects and experiences, remove the `seed-sync` job from ci.yml and this
# goes back to being a button — the workflow_dispatch trigger stays wired for
# exactly that.
#
# What "replaces everything" does and does not mean:
#   - Rows in data.ts are overwritten. An admin edit to one is reverted.
#   - A project created in the admin under a NEW slug survives — the sync only
#     deletes the slugs listed in SUPERSEDED_PROJECT_SLUGS.
#   - Experiences with a NULL display_order are treated as not-seed-managed and
#     are left alone.
#
# ── Why it does not talk to Postgres directly ───────────────────────────────
# The `postgres` service in the infrastructure stack declares no `ports:`. It is
# reachable only on dokploy-network, so a GitHub runner cannot connect to it at
# all. Exposing the database to the internet so CI could reach it would be a far
# worse trade than asking Dokploy to run the command on its own host.
#
# So the job asks Dokploy to run a schedule that already exists on the server,
# reusing the same two secrets the deploy job needs. No SSH key, no database
# credentials, no new credential surface.
#
# ── One-time setup ──────────────────────────────────────────────────────────
# 1. In Dokploy -> Schedules, create a schedule of type "Dokploy Server":
#
#      Name:  seed-sync
#      Cron:  0 0 31 2 *      <- 31 February. A date that does not exist, so the
#                               schedule can never fire on its own; the only way
#                               it runs is runManually, from this workflow.
#      Shell: bash
#      Command:
#        set -e
#        d=""
#        for p in /etc/dokploy/applications/*/code; do
#          if [ -f "$p/docker-compose.prod.yml" ]; then d="$p"; break; fi
#        done
#        if [ -z "$d" ]; then
#          echo "FAIL: no repo checkout containing docker-compose.prod.yml"
#          exit 1
#        fi
#        echo "using $d"
#        cd "$d"
#        docker compose -f docker-compose.prod.yml --profile sync run --rm syncer
#
#    It locates the checkout rather than hardcoding a path, and exits non-zero
#    when it finds nothing — a sync that silently does nothing is the failure
#    mode worth designing against, since the symptom is a stale portfolio that
#    still looks deployed.
#
# 2. Add the schedule's id as the repository secret DOKPLOY_SYNC_SCHEDULE_ID.
#
# Until step 1 and 2 are done this job fails, loudly and on every push to main.
# That is on purpose: a deploy that quietly skips the data half is the exact
# failure this repository keeps getting bitten by.

on:
  # Called by ci.yml after every successful deploy to main.
  workflow_call:

  # And runnable on its own, for a migration between deploys.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "sync" to confirm — this overwrites seed-managed rows in production'
        required: true
        type: string

concurrency:
  group: seed-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync seed data into production
    runs-on: ubuntu-latest

    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      SCHEDULE_ID: ${{ secrets.DOKPLOY_SYNC_SCHEDULE_ID }}

    steps:
      # Only for a hand-run: the confirmation is what stops someone firing this
      # at production by reflex. A call from ci.yml is already gated by the
      # deploy it follows, so requiring an input there would just block it.
      # Checked before the secrets so a mistyped run fails on the harmless step.
      - name: Verify confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "sync" ]; then
            echo "::error::Confirmation input must be exactly 'sync'. Nothing was run."
            exit 1
          fi

      - name: Verify secrets are configured
        run: |
          missing=""
          [ -z "$DOKPLOY_URL" ] && missing="$missing DOKPLOY_URL"
          [ -z "$DOKPLOY_API_KEY" ] && missing="$missing DOKPLOY_API_KEY"
          [ -z "$SCHEDULE_ID" ] && missing="$missing DOKPLOY_SYNC_SCHEDULE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see the setup notes at the top of this file."
            exit 1
          fi

      - name: Run the seed sync on the server
        run: |
          set -euo pipefail

          # --retry-all-errors covers a Dokploy restart, not a rejected request:
          # -f makes curl exit non-zero on 4xx/5xx, and a 401 or a bad schedule
          # id must fail the job rather than be retried into looking like a
          # network blip.
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST "$DOKPLOY_URL/api/schedule.runManually" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"scheduleId\":\"$SCHEDULE_ID\"}" \
            -o response.json

          cat response.json
          echo

          # Dokploy answers 200 for "I accepted the request", so a green curl is
          # not evidence the sync succeeded. Read the body before believing it.
          if grep -qi '"success"[[:space:]]*:[[:space:]]*false' response.json; then
            echo "::error::Dokploy reported the schedule run as failed — check its logs in the Dokploy UI."
            exit 1
          fi

      # The job above proves Dokploy accepted the request. This proves the
      # database actually changed, which is the only thing anyone cares about.
      - name: Verify production no longer serves superseded content
        run: |
          set -uo pipefail
          # The sync flushes the portfolio cache, but the page still has to be
          # re-rendered and fetched; give it a moment before judging.
          sleep 20

          html=$(curl -fsS --max-time 30 https://jcsoftdev.com/ || true)
          if [ -z "$html" ]; then
            echo "::warning::Could not fetch jcsoftdev.com to verify. The sync may still have succeeded."
            exit 0
          fi

          # These are the slugs SUPERSEDED_PROJECT_SLUGS deletes. If any survives
          # on the rendered page, the sync did not take.
          stale=$(printf '%s' "$html" | grep -oiE 'pulzifi|travitur' | sort -u | tr '\n' ' ')
          if [ -n "$stale" ]; then
            echo "::error::Production still renders superseded content: $stale"
            exit 1
          fi
          echo "Production is clean — no superseded content on the homepage."
